# Codegen fixes for default.xex (Skylanders: SuperChargers, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from the other Skylanders projects (SwapForceRecomp,
# SSARecomp, GiantsRecomp) apply to their own executables only and are checked against this one.
#
# Entries are added as codegen and the runtime report them.

# 0x831C7CC8 is in BinkOpen (Bink 2), right after it reads the 44-byte movie header into r1+112
# (li r6,44; addi r5,r1,112; bctrl in sub_831C7AF8) and just before the signature compares
# (lis r11,0x6632 / ori 0x424B, "KB2f" and later). Found in the generated code by the same shape as
# TrapTeamRecomp's and GiantsRecomp's hooks. src/hooks/intro_skip_hook.cpp cuts the logo movies
# (skip_intro, on) and optionally the opening movie (skip_opening_movie, off) by setting their frame
# count to 1; other movies pass unchanged.
[[midasm_hook]]
address = 0x831C7CC8
name = "BinkHeaderLoaded"
registers = ["r1"]

# The scene size hooks (src/hooks/scene_size_hook.cpp; experimental, off unless scene_size is
# set): the same render code as SwapForceRecomp's, found in a dump of this game's code by the
# instructions at its four hooks, each with the same instructions around it.
# 0x826E8718 is the start of the function that computes an igRenderTarget's size (r3): the
# only one reading its own _width / _height (+0x20 / +0x24) with the scales (+0x28 / +0x2C) nearby.
# The hook swaps in scene_size for a target that says 1040x620 (the 360 pipeline's mainScene).
[[midasm_hook]]
address = 0x826E8718
name = "SceneSizeHook"
registers = ["r3"]

# 0x826EDC64 follows lis r5,0x20: r5 = 0x200000 is the frame's EDRAM planning heap (2048 tiles
# of 1024 bytes) for its init call; with the SDK's 4096-tile EDRAM it gets that many. r5 is only
# that argument.
[[midasm_hook]]
address = 0x826EDC64
name = "EdramHeapSizeHook"
registers = ["r5"]

# 0x82600D20 is cmpwi cr6,r5,0x800: a render pass's EDRAM tiles against 2048, above which
# the game switches to predicated tiling (black scene in the SDK). r5 is lowered to 2048 when the
# pass fits into a 4096-tile EDRAM the SDK runs; r5 is not read on that path.
[[midasm_hook]]
address = 0x82600D20
name = "EdramTilingHook"
registers = ["r5"]

# 0x82601910 follows subfic r9,r11,0x800 in the per-pass EDRAM allocation: r9 = 2048 minus
# the depth surface's tiles (r11), stored two instructions on. With a 4096-tile EDRAM the depth goes
# to its top instead; r9 is only read by that store.
[[midasm_hook]]
address = 0x82601910
name = "EdramDepthBaseHook"
registers = ["r9", "r11"]

# 0x82B0BCA0 is the call from the scene camera's per-frame set-up to the perspective builder
# sub_8250E610(r3 = projection matrix, f1 = horizontal FOV, f2 = vertical FOV, f3 = aspect, f4 =
# near, f5 = far; radians), as in SwapForceRecomp (hook UltrawideFovHook): the builder found by Swap
# Force's instructions, the call by a probe on all its callers (every frame, 16:9, the camera's
# FOV). src/hooks/ultrawide_hook.cpp widens f3 (and f1, keeping the vertical FOV) for a window wider
# than 16:9 with ultrawide_fov on; it only changes this call's arguments.
[[midasm_hook]]
address = 0x82B0BCA0
name = "UltrawideFovHook"
registers = ["f1", "f2", "f3"]

[functions]
# 0x8252E1F8 is called through a pointer (the first boot ended with "Call to invalid or
# unregistered function at guest address 0x8252E1F8" 3 s in); the analyzer had it inside the
# 12-byte sub_8252E1F0 next to it, two tiny functions back to back. Registering the start splits
# them; no size given, the analyzer finds the end.
0x8252E1F8 = {}

# More starts of the same shape, found in the whole code (a dump of guest memory with the input
